default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: private-overlay-fast
        name: private overlay (public-context fast checks)
        entry: bash scripts/check.sh --fast
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      - id: private-overlay-full
        name: private overlay (complete public checks)
        entry: bash scripts/check.sh
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
