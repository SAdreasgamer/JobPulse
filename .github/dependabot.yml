version: 2

# Cooldowns hold a freshly published release long enough for it to be yanked
# before it is proposed here. Security updates ignore cooldown, so advisories
# still arrive immediately.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    ignore:
      # TypeScript 7 (the native port) breaks openapi-typescript, whose latest
      # release (7.13.0) still declares `typescript: ^5.x` and dies with
      # "Cannot read properties of undefined (reading 'createKeywordTypeNode')"
      # on TS 7. That generator backs the API-types drift gate, so the whole
      # toolchain stays on TS 6 until openapi-typescript supports 7. Drop this
      # entry then; minor and patch TS updates still come through.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: "/apps/api"
    schedule:
      interval: weekly
    groups:
      uv-dependencies:
        patterns: ["*"]
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

  # Grouped, or this opens one pull request per action. SHA pins carry no semver,
  # so only the flat cooldown applies here.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
